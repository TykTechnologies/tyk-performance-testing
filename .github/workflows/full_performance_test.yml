name: Full Performance Test
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Choose Cloud Provider'
        required: true
        type: choice
        default: Azure
        options:
          - Azure
          - AWS
          - GCP
      tyk_version:
        description: 'Tyk Gateway version'
        required: true
        type: string
        default: 'v5.7'
      tyk_profiler_enabled:
        description: 'Enabled Tyk Profiling'
        required: true
        type: boolean
        default: false
      simulate_node_failure:
        description: 'Simulate node failure during test'
        required: false
        type: boolean
        default: false
      node_failure_delay_minutes:
        description: 'Minutes to wait before simulating node failure'
        required: false
        type: number
        default: 10
      node_downtime_minutes:
        description: 'Minutes to keep the node down during failure simulation'
        required: false
        type: number
        default: 5
      guarantee_errors:
        description: 'Use iptables to guarantee connection errors during node failure'
        required: false
        type: boolean
        default: false
      use_terraform_cloud:
        description: 'Use Terraform Cloud for remote state (default: false for local state, set true for cloud)'
        required: false
        type: boolean
        default: false
      test_duration_minutes:
        description: 'Test duration in minutes (30-360)'
        required: false
        type: number
        default: 300

env:
  provider: ${{ inputs.cloud == 'Azure' && 'aks' || (inputs.cloud == 'AWS' && 'eks' || 'gke') }}

concurrency:
  group: ${{ inputs.use_terraform_cloud && inputs.cloud || format('{0}-local-{1}', inputs.cloud, github.run_id) }}
  cancel-in-progress: ${{ inputs.use_terraform_cloud }}

jobs:
  performance_test:
    name: "${{ inputs.cloud }} full performance run on Tyk ${{ inputs.tyk_version }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install wget
        if: ${{ inputs.tyk_profiler_enabled == true }}
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Configure AKS credentials
        if: ${{ inputs.cloud == 'Azure' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure AWS credentials
        if: ${{ inputs.cloud == 'AWS' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_CLUSTER_LOCATION }}

      - name: Authenticate into gcloud
        if: ${{ inputs.cloud == 'GCP' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Install gcloud CLI
        if: ${{ inputs.cloud == 'GCP' }}
        uses: google-github-actions/setup-gcloud@v2.1.0

      - name: Install gcloud k8s auth component
        if: ${{ inputs.cloud == 'GCP' }}
        run: gcloud components install gke-gcloud-auth-plugin

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3.1.1
        with:
          cli_config_credentials_token: ${{ inputs.use_terraform_cloud && secrets.TF_API_TOKEN || '' }}
          terraform_version: "1.8.2"

      - name: Configure Terraform Backend
        run: |
          if [[ "${{ inputs.use_terraform_cloud }}" == "true" ]]; then
            echo "🔄 Setting up Terraform Cloud backend configuration..."
            cp ${{ env.provider }}/terraform.cloud.tf.example ${{ env.provider }}/terraform.cloud.tf
            cp .github/${{ env.provider }}/deployments.tf deployments/terraform.cloud.tf
            cp .github/${{ env.provider }}/tests.tf tests/terraform.cloud.tf
            echo "✅ Terraform Cloud backend configured"
          else
            echo "🔄 Setting up local Terraform backend (removing cloud configurations)..."
            # Remove any existing backend configuration files to ensure local state
            rm -f ${{ env.provider }}/terraform.cloud.tf
            rm -f deployments/terraform.cloud.tf
            rm -f tests/terraform.cloud.tf
            echo "✅ Local backend configured (cloud configurations removed)"
          fi

      - name: Check for Orphaned Resources
        if: ${{ !inputs.use_terraform_cloud }}
        continue-on-error: true
        run: |
          echo "🔍 Checking for existing resources that might conflict..."
          
          if [[ "${{ inputs.cloud }}" == "Azure" ]]; then
            echo "Checking for existing Azure resources..."
            RESOURCE_GROUP="pt-${{ vars.AZURE_CLUSTER_LOCATION }}"
            if az group show --name "$RESOURCE_GROUP" &>/dev/null; then
              echo "⚠️  WARNING: Resource group '$RESOURCE_GROUP' already exists!"
              echo "This may indicate orphaned resources from a previous run."
              echo "Consider running the cleanup workflow if tests fail."
              az resource list --resource-group "$RESOURCE_GROUP" --query '[].{Name:name, Type:type, Location:location}' --output table || true
            else
              echo "✅ No conflicting Azure resource group found"
            fi
            
          elif [[ "${{ inputs.cloud }}" == "AWS" ]]; then
            echo "Checking for existing AWS EKS clusters..."
            if aws eks describe-cluster --name "pt-${{ vars.AWS_CLUSTER_LOCATION }}" --region "${{ vars.AWS_CLUSTER_LOCATION }}" &>/dev/null; then
              echo "⚠️  WARNING: EKS cluster 'pt-${{ vars.AWS_CLUSTER_LOCATION }}' already exists!"
              echo "This may indicate orphaned resources from a previous run."
              echo "Consider running the cleanup workflow if tests fail."
            else
              echo "✅ No conflicting AWS EKS cluster found"
            fi
            
          elif [[ "${{ inputs.cloud }}" == "GCP" ]]; then
            echo "Checking for existing GCP GKE clusters..."
            if gcloud container clusters describe "pt-${{ vars.GCP_CLUSTER_LOCATION }}" --zone "${{ vars.GCP_CLUSTER_LOCATION }}" --project "${{ secrets.GCP_PROJECT }}" &>/dev/null; then
              echo "⚠️  WARNING: GKE cluster 'pt-${{ vars.GCP_CLUSTER_LOCATION }}' already exists!"
              echo "This may indicate orphaned resources from a previous run."
              echo "Consider running the cleanup workflow if tests fail."
            else
              echo "✅ No conflicting GCP GKE cluster found"
            fi
          fi

      - name: Check and cleanup existing AKS cluster
        if: ${{ inputs.cloud == 'Azure' }}
        continue-on-error: true
        run: |
          echo "🔍 Checking for existing AKS cluster..."
          CLUSTER_NAME="pt-${{ vars.AZURE_CLUSTER_LOCATION }}"
          RESOURCE_GROUP="pt-${{ vars.AZURE_CLUSTER_LOCATION }}"
          
          if az aks show --name "$CLUSTER_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "⚠️  Found existing AKS cluster: $CLUSTER_NAME"
            echo "🗑️  Destroying existing cluster to prevent conflicts..."
            az aks delete --name "$CLUSTER_NAME" --resource-group "$RESOURCE_GROUP" --yes --no-wait
            echo "🕐 Waiting for cluster deletion to complete..."
            az aks wait --name "$CLUSTER_NAME" --resource-group "$RESOURCE_GROUP" --deleted --timeout 900 || echo "⚠️  Timeout waiting for deletion, continuing..."
            echo "✅ Existing AKS cluster cleanup completed"
          else
            echo "✅ No existing AKS cluster found"
          fi

      - name: Stand up AKS cluster
        if: ${{ inputs.cloud == 'Azure' }}
        run: |
          cd aks
          terraform init
          terraform apply \
            --var="cluster_location=${{ vars.AZURE_CLUSTER_LOCATION }}" \
            --var="cluster_machine_type=${{ vars.AZURE_CLUSTER_MACHINE_TYPE }}" \
            --var="upstream_machine_type=${{ vars.AZURE_UPSTREAM_MACHINE_TYPE }}" \
            --var="tests_machine_type=${{ vars.AZURE_TEST_MACHINE_TYPE }}" \
            --var="services_nodes_count=4" \
            --auto-approve

      - name: Backup AKS Terraform State
        if: ${{ inputs.cloud == 'Azure' && !inputs.use_terraform_cloud }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aks-cluster-terraform-state-${{ github.run_id }}
          path: |
            aks/terraform.tfstate
            aks/.terraform.lock.hcl
          retention-days: 1

      - name: Connect to AKS cluster
        if: ${{ inputs.cloud == 'Azure' }}
        run: |
          az aks get-credentials \
            --resource-group "pt-${{ vars.AZURE_CLUSTER_LOCATION }}" \
            --name "pt-${{ vars.AZURE_CLUSTER_LOCATION }}"

          kubectl config rename-context $(kubectl config current-context) performance-testing

      - name: Check and cleanup existing EKS cluster
        if: ${{ inputs.cloud == 'AWS' }}
        continue-on-error: true
        run: |
          echo "🔍 Checking for existing EKS cluster..."
          CLUSTER_NAME="pt-${{ vars.AWS_CLUSTER_LOCATION }}"
          REGION="${{ vars.AWS_CLUSTER_LOCATION }}"
          
          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "$REGION" >/dev/null 2>&1; then
            echo "⚠️  Found existing EKS cluster: $CLUSTER_NAME"
            echo "🗑️  Destroying existing cluster to prevent conflicts..."
            aws eks delete-cluster --name "$CLUSTER_NAME" --region "$REGION"
            echo "🕐 Waiting for cluster deletion to complete..."
            aws eks wait cluster-deleted --name "$CLUSTER_NAME" --region "$REGION" || echo "⚠️  Timeout waiting for deletion, continuing..."
            echo "✅ Existing EKS cluster cleanup completed"
          else
            echo "✅ No existing EKS cluster found"
          fi

      - name: Stand up EKS cluster
        if: ${{ inputs.cloud == 'AWS' }}
        run: |
          cd eks
          terraform init
          terraform apply \
            --var="cluster_location=${{ vars.AWS_CLUSTER_LOCATION }}" \
            --var="cluster_machine_type=${{ vars.AWS_CLUSTER_MACHINE_TYPE }}" \
            --var="upstream_machine_type=${{ vars.AWS_UPSTREAM_MACHINE_TYPE }}" \
            --var="tests_machine_type=${{ vars.AWS_TEST_MACHINE_TYPE }}" \
            --var="services_nodes_count=4" \
            --auto-approve

      - name: Backup EKS Terraform State
        if: ${{ inputs.cloud == 'AWS' && !inputs.use_terraform_cloud }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: eks-cluster-terraform-state-${{ github.run_id }}
          path: |
            eks/terraform.tfstate
            eks/.terraform.lock.hcl
          retention-days: 1

      - name: Connect to EKS cluster
        if: ${{ inputs.cloud == 'AWS' }}
        run: |
          aws eks --region "${{ vars.AWS_CLUSTER_LOCATION }}" update-kubeconfig --name "pt-${{ vars.AWS_CLUSTER_LOCATION }}"

          kubectl config rename-context $(kubectl config current-context) performance-testing

      - name: Check and cleanup existing GKE cluster  
        if: ${{ inputs.cloud == 'GCP' }}
        continue-on-error: true
        run: |
          echo "🔍 Checking for existing GKE cluster..."
          CLUSTER_NAME="pt-${{ vars.GCP_CLUSTER_LOCATION }}"
          ZONE="${{ vars.GCP_CLUSTER_LOCATION }}"
          PROJECT="${{ secrets.GCP_PROJECT }}"
          
          if gcloud container clusters describe "$CLUSTER_NAME" --zone="$ZONE" --project="$PROJECT" >/dev/null 2>&1; then
            echo "⚠️  Found existing GKE cluster: $CLUSTER_NAME"
            echo "🗑️  Destroying existing cluster to prevent conflicts..."
            gcloud container clusters delete "$CLUSTER_NAME" --zone="$ZONE" --project="$PROJECT" --quiet
            echo "✅ Existing GKE cluster cleanup completed"
          else
            echo "✅ No existing GKE cluster found"
          fi

      - name: Stand up GKE cluster
        if: ${{ inputs.cloud == 'GCP' }}
        run: |
          cd gke
          terraform init
          terraform apply \
            --var="project=${{ secrets.GCP_PROJECT }}" \
            --var="cluster_location=${{ vars.GCP_CLUSTER_LOCATION }}" \
            --var="cluster_machine_type=${{ vars.GCP_CLUSTER_MACHINE_TYPE }}" \
            --var="upstream_machine_type=${{ vars.GCP_UPSTREAM_MACHINE_TYPE }}" \
            --var="tests_machine_type=${{ vars.GCP_TEST_MACHINE_TYPE }}" \
            --var="services_nodes_count=4" \
            --auto-approve

      - name: Backup GKE Terraform State
        if: ${{ inputs.cloud == 'GCP' && !inputs.use_terraform_cloud }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gke-cluster-terraform-state-${{ github.run_id }}
          path: |
            gke/terraform.tfstate
            gke/.terraform.lock.hcl
          retention-days: 1

      - name: Connect to GKE cluster
        if: ${{ inputs.cloud == 'GCP' }}
        run: |
          gcloud container clusters get-credentials "pt-${{ vars.GCP_CLUSTER_LOCATION }}" \
            --zone "${{ vars.GCP_CLUSTER_LOCATION }}" \
            --project "${{ secrets.GCP_PROJECT }}"
          
          kubectl config rename-context $(kubectl config current-context) performance-testing

      - name: Deploy testing resources
        run: |
          cd deployments
          terraform init
          terraform apply \
            --var="kubernetes_config_context=performance-testing" \
            --var="tyk_version=${{ inputs.tyk_version }}" \
            --var="tyk_license=${{ secrets.DASH_LICENSE }}" \
            --var="tyk_profiler_enabled=${{ inputs.tyk_profiler_enabled }}" \
            --auto-approve
          
          # Calculate stabilization wait time based on test duration
          # Minimum 5 minutes, maximum 15 minutes, scales with duration
          STABILIZATION_MINUTES=$(( ${{ inputs.test_duration_minutes }} >= 60 ? 10 : 5 ))
          if [[ ${{ inputs.test_duration_minutes }} -ge 180 ]]; then
            STABILIZATION_MINUTES=15
          fi
          echo "Waiting ${STABILIZATION_MINUTES} minutes for deployment to stabilize..."
          sleep $((STABILIZATION_MINUTES * 60))

      - name: Backup Deployments Terraform State
        if: ${{ !inputs.use_terraform_cloud }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.provider }}-deployments-terraform-state-${{ github.run_id }}
          path: |
            deployments/terraform.tfstate
            deployments/.terraform.lock.hcl
          retention-days: 1

      - name: Show Tyk Gateway logs
        run: |
          echo "=== Tyk Gateway Pod Logs (first 200 lines) ==="
          kubectl logs -n tyk $(kubectl get pods -n tyk --selector=app=gateway-tyk-tyk-gateway -o jsonpath='{.items[0].metadata.name}') --tail=200 || echo "Failed to get Tyk logs"

      - name: Run Tests
        run: |
          # Start k6 pod monitoring in background to capture logs during execution
          (
            echo "Starting k6 pod monitoring in background..."
            sleep 30  # Give tests time to start
            
            LAST_INITIALIZER_LOG_LINE=0
            LAST_RUNNER_LOG_LINE=0
            
            while true; do
              # === Show Job-level activeDeadlineSeconds for k6 initializer/runner/starter Jobs ===
              echo ""
              echo "=== k6 Job activeDeadlineSeconds (snapshot) at $(date '+%H:%M:%S') ==="
              # Initializer jobs
              kubectl get jobs -A -l "k6_cr,job-name" -o json 2>/dev/null \
                | jq -r '.items[] | select(.metadata.labels["job-name"] | contains("initializer")) | "\(.metadata.namespace)/\(.metadata.name): ADS=\(.spec.activeDeadlineSeconds // "none")"' \
                || echo "  (no initializer jobs found)"
              # Runner jobs
              kubectl get jobs -A -l "k6_cr,runner=true" -o json 2>/dev/null \
                | jq -r '.items[] | "\(.metadata.namespace)/\(.metadata.name): ADS=\(.spec.activeDeadlineSeconds // "none")"' \
                || echo "  (no runner jobs found)"
              # Starter jobs
              kubectl get jobs -A -l "k6_cr" -o json 2>/dev/null \
                | jq -r '.items[] | select(.metadata.labels["job-name"] | contains("starter")) | "\(.metadata.namespace)/\(.metadata.name): ADS=\(.spec.activeDeadlineSeconds // "none")"' \
                || echo "  (no starter jobs found)"

              # Optional: warn loudly if any runner job is pinned to 3600s
              RUNNER_ADS=$(kubectl get jobs -A -l "k6_cr,runner=true" -o json 2>/dev/null \
                | jq -r '.items[] | (.spec.activeDeadlineSeconds // 0)' | sort -u)
              if echo "$RUNNER_ADS" | grep -q "^3600$"; then
                echo "⚠️  WARNING: Detected runner Job activeDeadlineSeconds=3600 (1h). This will kill the test after exactly 60 minutes!"
              fi

              # Check for k6 initializer pods (these run first and set up the test)
              K6_INITIALIZERS=$(kubectl get pods -A -l "k6_cr,job-name" -o json 2>/dev/null | jq -r '.items[] | select(.metadata.labels["job-name"] | contains("initializer")) | "\(.metadata.namespace)/\(.metadata.name)"' || echo "")
              
              if [[ -n "$K6_INITIALIZERS" ]]; then
                echo ""
                echo "=== k6 Initializer Pod Logs at $(date '+%H:%M:%S') ==="
                for initializer in $K6_INITIALIZERS; do
                  NS=$(echo $initializer | cut -d'/' -f1)
                  POD=$(echo $initializer | cut -d'/' -f2)
                  
                  # Get initializer logs focusing on duration setup
                  echo "Initializer $POD logs (duration setup):"
                  kubectl logs -n "$NS" "$POD" 2>/dev/null | grep -E "autoscaling-gradual|totalMinutes|DURATION|stages|parse|resolve|environment" | tail -20 || echo "  No duration-related logs yet"
                done
              fi
              
              # Check for k6 runner pods
              K6_RUNNERS=$(kubectl get pods -A -l "k6_cr,runner=true" -o json 2>/dev/null | jq -r '.items[] | "\(.metadata.namespace)/\(.metadata.name)"' || echo "")
              
              if [[ -n "$K6_RUNNERS" ]]; then
                echo ""
                echo "=== k6 Runner Pod Status at $(date '+%H:%M:%S') ==="
                for runner in $K6_RUNNERS; do
                  NS=$(echo $runner | cut -d'/' -f1)
                  POD=$(echo $runner | cut -d'/' -f2)
                  
                  # Get pod status
                  STATUS=$(kubectl get pod -n "$NS" "$POD" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
                  READY=$(kubectl get pod -n "$NS" "$POD" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
                  echo "Pod: $POD - Status: $STATUS, Ready: $READY"
                  
                  # Get recent execution logs
                  echo "Recent execution logs from $POD:"
                  kubectl logs -n "$NS" "$POD" --tail=30 2>/dev/null | grep -E "scenario:|executor:|iteration|data_received|data_sent|http_req_duration|http_reqs|vus:|teardown|setup" || echo "  No execution logs yet"
                  
                  # Check for any errors or warnings
                  echo "Checking for errors/warnings:"
                  kubectl logs -n "$NS" "$POD" --tail=100 2>/dev/null | grep -iE "error|warn|fail|exception|panic" | head -5 || echo "  No errors found"
                done
              fi
              
              # Check for k6 test resources and their status
              K6_TESTS=$(kubectl get k6 -A --no-headers 2>/dev/null)
              if [[ -n "$K6_TESTS" ]]; then
                echo ""
                echo "=== k6 Test Resources at $(date '+%H:%M:%S') ==="
                kubectl get k6 -A
                
                # Check if tests are still running
                RUNNING_TESTS=$(echo "$K6_TESTS" | grep -v "finished" | wc -l)
                if [[ "$RUNNING_TESTS" -eq 0 ]]; then
                  echo "All k6 tests have finished. Stopping monitoring."
                  break
                fi
              fi
              
              # Sleep for 2 minutes before next check (more frequent for better visibility)
              sleep 120
            done
            
            echo "k6 monitoring completed at $(date '+%H:%M:%S')"
          ) &
          K6_MONITOR_PID=$!
          echo "k6 monitoring started with PID: $K6_MONITOR_PID"
          
          # Start node failure simulation in background if enabled
          if [[ "${{ inputs.simulate_node_failure }}" == "true" ]]; then
            echo "Node failure simulation enabled - will terminate a node after ${{ inputs.node_failure_delay_minutes }} minutes"
            
            (
              # Wait for specified delay FIRST
              echo "Waiting ${{ inputs.node_failure_delay_minutes }} minutes before simulating node failure..."
              sleep $((${{ inputs.node_failure_delay_minutes }} * 60))
              
              echo "=== Starting node failure simulation at $(date '+%H:%M:%S') ==="
              
              # Get nodes running gateway pods
              echo "Finding nodes with gateway pods..."
              GATEWAY_NODES=$(kubectl get pods -n tyk -l app.kubernetes.io/name=tyk-gateway -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}' | sort -u)
              
              if [[ -z "$GATEWAY_NODES" ]]; then
                echo "No nodes found with gateway pods, trying to find any pod with 'gateway' in name..."
                GATEWAY_NODES=$(kubectl get pods -n tyk --no-headers | grep gateway | awk '{print $1}' | head -1 | xargs -I {} kubectl get pod {} -n tyk -o jsonpath='{.spec.nodeName}')
              fi
              
              NODE_TO_TERMINATE=$(echo "$GATEWAY_NODES" | head -n 1)
              
              if [[ -z "$NODE_TO_TERMINATE" ]]; then
                echo "No gateway nodes found to terminate"
                exit 0
              fi
              
              echo "Selected node for termination: $NODE_TO_TERMINATE"
              
              # Cloud-specific node termination
              if [[ "${{ inputs.cloud }}" == "Azure" ]]; then
                # Get VMSS instance ID from node name
                VMSS_NAME=$(az vmss list --resource-group "pt-${{ vars.AZURE_CLUSTER_LOCATION }}" --query "[0].name" -o tsv)
                INSTANCE_ID=$(az vmss list-instances --resource-group "pt-${{ vars.AZURE_CLUSTER_LOCATION }}" --name "$VMSS_NAME" --query "[?osProfile.computerName=='$NODE_TO_TERMINATE'].instanceId" -o tsv)
                
                if [[ -n "$INSTANCE_ID" ]]; then
                  echo "Terminating Azure VMSS instance: $INSTANCE_ID"
                  az vmss delete-instances \
                    --resource-group "pt-${{ vars.AZURE_CLUSTER_LOCATION }}" \
                    --name "$VMSS_NAME" \
                    --instance-ids "$INSTANCE_ID" \
                    --no-wait
                  echo "Azure node termination initiated"
                else
                  echo "Could not find Azure VMSS instance for node: $NODE_TO_TERMINATE"
                fi
                
              elif [[ "${{ inputs.cloud }}" == "AWS" ]]; then
                # Get EC2 instance ID from node provider ID
                INSTANCE_ID=$(kubectl get node "$NODE_TO_TERMINATE" -o jsonpath='{.spec.providerID}' | cut -d'/' -f5)
                
                if [[ -n "$INSTANCE_ID" ]]; then
                  echo "Terminating AWS EC2 instance: $INSTANCE_ID"
                  aws ec2 terminate-instances \
                    --instance-ids "$INSTANCE_ID" \
                    --region "${{ vars.AWS_CLUSTER_LOCATION }}"
                  echo "AWS node termination initiated"
                else
                  echo "Could not find AWS instance ID for node: $NODE_TO_TERMINATE"
                fi
                
              elif [[ "${{ inputs.cloud }}" == "GCP" ]]; then
                # === NODE FAILURE (GKE, with visible node count reduction) ===
                INSTANCE_NAME="$NODE_TO_TERMINATE"
                ZONE="${{ vars.GCP_CLUSTER_LOCATION }}"
                CLUSTER_NAME="pt-${ZONE}"
                
                echo "Node details:"
                echo "  Instance: $INSTANCE_NAME"
                echo "  Zone: $ZONE"
                echo "  Cluster: $CLUSTER_NAME"
                
                # Count pods on the node before deletion
                echo "Pods running on node $INSTANCE_NAME before failure:"
                kubectl get pods --all-namespaces --field-selector spec.nodeName=$INSTANCE_NAME -o wide
                POD_COUNT=$(kubectl get pods --all-namespaces --field-selector spec.nodeName=$INSTANCE_NAME --no-headers | wc -l)
                GATEWAY_POD_COUNT=$(kubectl get pods -n tyk --field-selector spec.nodeName=$INSTANCE_NAME --selector=app=gateway-tyk-tyk-gateway --no-headers | wc -l)
                echo "Total pods on node: $POD_COUNT (Gateway pods: $GATEWAY_POD_COUNT)"
                
                # Check pod distribution across all nodes
                echo "Pod distribution before failure:"
                for node in $(kubectl get nodes -o name | cut -d/ -f2); do
                  count=$(kubectl get pods -n tyk --field-selector spec.nodeName=$node --no-headers | wc -l)
                  echo "  $node: $count pods"
                done
                
                if [[ -n "$INSTANCE_NAME" ]]; then
                  # Resolve the MIG that owns this instance
                  MIG_URL=$(gcloud compute instances describe "$INSTANCE_NAME" \
                    --zone "$ZONE" --format='get(metadata.items[created-by])')
                  MIG_NAME=$(basename "$MIG_URL")
                  MIG_SIZE=$(gcloud compute instance-groups managed describe "$MIG_NAME" \
                    --zone "$ZONE" --format='get(targetSize)')
                  
                  echo "=== NODE FAILURE at $(date '+%H:%M:%S') ==="
                  echo "Simulating hard failure of $INSTANCE_NAME in MIG $MIG_NAME (drop target size from $MIG_SIZE to $((MIG_SIZE-1)))"
                  
                  # Identify gateway pods on the soon-to-fail node and remove them fast from endpoints
                  GATEWAY_PODS_ON_NODE=$(kubectl get pods -n tyk -l app=gateway-tyk-tyk-gateway -o wide \
                    --field-selector spec.nodeName="$INSTANCE_NAME" --no-headers | awk '{print $1}')
                  POD_IPS=$(kubectl get pods -n tyk -l app=gateway-tyk-tyk-gateway -o wide \
                    --field-selector spec.nodeName="$INSTANCE_NAME" -o jsonpath='{.items[*].status.podIP}')
                  
                  if [[ -n "$GATEWAY_PODS_ON_NODE" ]]; then
                    echo "Force-deleting pods scheduled on $INSTANCE_NAME to drop endpoints immediately:"
                    echo "$GATEWAY_PODS_ON_NODE" | xargs -r -n1 -I{} \
                      kubectl delete pod -n tyk {} --force --grace-period=0 --wait=false
                  else
                    echo "No gateway pods found on $INSTANCE_NAME"
                  fi
                  
                  # Delete the instance and reduce MIG target size by 1 (visible node count goes 4 -> 3)
                  gcloud compute instance-groups managed delete-instances "$MIG_NAME" \
                    --instances="$INSTANCE_NAME" --zone="$ZONE" --quiet
                  echo "Deleted instance $INSTANCE_NAME; MIG target size reduced from $MIG_SIZE to $((MIG_SIZE-1))"
                  
                  # Immediately remove the Node object so 'kubectl get nodes' shows 3, not 3+NotReady
                  kubectl delete node "$INSTANCE_NAME" --ignore-not-found=true || true
                  
                  echo "Node loss triggered - observing brief impact; will resize MIG back to $MIG_SIZE shortly..."
                  
                  # Optional: Add iptables REJECT rules for guaranteed errors (30-60s)
                  if [[ "${{ inputs.guarantee_errors }}" == "true" ]]; then
                    echo "=== Adding iptables REJECT rules for immediate failures ==="
                    # Restrict the REJECTs strictly to IPs of pods that were on the failed node
                    for n in $(kubectl get nodes -o name | cut -d/ -f2 | grep -v "$INSTANCE_NAME"); do
                      echo "Adding REJECT rules on node $n for failed-node pod IPs: $POD_IPS"
                      kubectl debug node/$n --profile=sysadmin --image=nicolaka/netshoot -- \
                        bash -c "for ip in $POD_IPS; do iptables -I OUTPUT -d \$ip -p tcp -j REJECT --reject-with tcp-reset; done; sleep 60; for ip in $POD_IPS; do iptables -D OUTPUT -d \$ip -p tcp -j REJECT --reject-with tcp-reset; done" &
                    done
                  fi
                  
                  # Monitor for the configured downtime duration
                  DOWNTIME_MINUTES=${{ inputs.node_downtime_minutes }}
                  ITERATIONS=$(( DOWNTIME_MINUTES * 60 / 5 ))
                  echo "Monitoring impact for $DOWNTIME_MINUTES minutes ($ITERATIONS checks)..."
                  
                  for i in $(seq 1 $ITERATIONS); do
                    sleep 5
                    echo ""
                    echo "[$((i*5))s / $(( DOWNTIME_MINUTES * 60 ))s] Impact monitoring:"
                    echo "  Node count: $(kubectl get nodes --no-headers | wc -l) (was $MIG_SIZE)"
                    kubectl get nodes | grep -E "NAME|NotReady" || echo "    All nodes ready"
                    
                    echo "  Gateway endpoints ready:"
                    ENDPOINT_COUNT=$(kubectl get endpoints -n tyk gateway-tyk-svc-tyk-gateway -o json 2>/dev/null \
                      | jq -r '.subsets[0].addresses | length' 2>/dev/null || echo "0")
                    echo "    $ENDPOINT_COUNT endpoints"
                    
                    echo "  Gateway pod phases:"
                    kubectl get pods -n tyk -l app=gateway-tyk-tyk-gateway --no-headers \
                      | awk '{print $3}' | sort | uniq -c | awk '{print "    "$2": "$1}'
                    
                    # Show any pods that are not Running
                    NOT_RUNNING=$(kubectl get pods -n tyk -l app=gateway-tyk-tyk-gateway --no-headers | grep -v "Running" | wc -l)
                    if [[ $NOT_RUNNING -gt 0 ]]; then
                      echo "  Non-running gateway pods:"
                      kubectl get pods -n tyk -l app=gateway-tyk-tyk-gateway --no-headers | grep -v "Running" | awk '{print "    "$1": "$3}'
                    fi
                    
                    # Check HPA status
                    echo "  HPA status:"
                    kubectl get hpa -n tyk --no-headers | awk '{print "    "$1": current="$2"/"$3", CPU="$4}'
                  done
                  
                  echo ""
                  echo "Resizing MIG $MIG_NAME back to $MIG_SIZE..."
                  gcloud compute instance-groups managed resize "$MIG_NAME" --size="$MIG_SIZE" --zone="$ZONE" --quiet
                  echo "MIG resized back to $MIG_SIZE - new node will be provisioned"
                else
                  echo "Could not find GCP instance for node: $NODE_TO_TERMINATE"
                fi
              fi
              
              echo "=== Node failure simulation completed ==="
              
              # Show cluster status after termination
              sleep 30
              echo "=== Cluster status after node termination ==="
              kubectl get nodes
              echo "=== Gateway pods status ==="
              kubectl get pods -n tyk --selector=app=gateway-tyk-tyk-gateway
            ) &
            
            echo "Node failure simulation scheduled in background"
          fi
          
          # Run the actual tests
          cd tests
          terraform init
          terraform apply \
            --var="kubernetes_config_context=performance-testing" \
            --var="tests_duration=${{ inputs.test_duration_minutes }}" \
            --auto-approve
          
          # === Attempt to extend Job-level ADS for runner Jobs (workaround for hidden 1h default) ===
          echo ""
          echo "=== Checking k6 Job activeDeadlineSeconds BEFORE patching ==="
          
          # Wait for Jobs to be created with retries
          echo "Waiting for k6 Jobs to be created..."
          for i in {1..30}; do
            JOB_COUNT=$(kubectl get jobs -A -l "k6_cr" --no-headers 2>/dev/null | wc -l)
            if [[ $JOB_COUNT -gt 0 ]]; then
              echo "Found $JOB_COUNT k6 Jobs after $i attempts"
              break
            fi
            echo "  Attempt $i: No Jobs yet, waiting..."
            sleep 2
          done
          
          # First, show current Job ADS values to confirm the issue
          echo "Current k6 Job activeDeadlineSeconds:"
          echo "Runner Jobs:"
          kubectl get jobs -A -l "k6_cr,runner=true" -o json 2>/dev/null \
            | jq -r '.items[] | "  \(.metadata.namespace)/\(.metadata.name): ADS=\(.spec.activeDeadlineSeconds // "not set")"' \
            || echo "  No runner jobs found"
          
          echo "Initializer Jobs:"
          kubectl get jobs -A -l "k6_cr,job-name" -o json 2>/dev/null \
            | jq -r '.items[] | select(.metadata.labels["job-name"] | contains("initializer")) | "  \(.metadata.namespace)/\(.metadata.name): ADS=\(.spec.activeDeadlineSeconds // "not set")"' \
            || echo "  No initializer jobs found"
          
          echo "Starter Jobs:"
          kubectl get jobs -A -l "k6_cr" -o json 2>/dev/null \
            | jq -r '.items[] | select(.metadata.labels["job-name"] | contains("starter")) | "  \(.metadata.namespace)/\(.metadata.name): ADS=\(.spec.activeDeadlineSeconds // "not set")"' \
            || echo "  No starter jobs found"
          
          # Check if we found the 3600s issue
          RUNNER_ADS=$(kubectl get jobs -A -l "k6_cr,runner=true" -o json 2>/dev/null \
            | jq -r '.items[] | .spec.activeDeadlineSeconds // 0' | sort -u)
          if echo "$RUNNER_ADS" | grep -q "^3600$"; then
            echo ""
            echo "⚠️  CONFIRMED: k6-operator sets Job activeDeadlineSeconds=3600 (1 hour) by default!"
            echo "⚠️  This is why tests stop at exactly 60 minutes."
            echo ""
          fi
          
          echo "=== Starting patch process ==="
          DESIRED_ADS=$(( ${{ inputs.test_duration_minutes }} * 60 + 1800 ))
          echo "Desired activeDeadlineSeconds: $DESIRED_ADS seconds ($(( ${{ inputs.test_duration_minutes }} + 30 )) minutes)"
          
          # Patch runner Jobs
          echo "Looking for runner Jobs to patch..."
          for job in $(kubectl get jobs -A -l "k6_cr,runner=true" -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' 2>/dev/null); do
            if [[ -n "$job" ]]; then
              ns=$(echo "$job" | cut -d/ -f1)
              name=$(echo "$job" | cut -d/ -f2)
              
              # Show current ADS
              current_ads=$(kubectl get job -n "$ns" "$name" -o jsonpath='{.spec.activeDeadlineSeconds}' 2>/dev/null || echo "none")
              echo "  $job current ADS=$current_ads"
              
              # Only patch if current ADS is 3600 (1 hour) or not set
              if [[ "$current_ads" == "3600" ]] || [[ "$current_ads" == "" ]] || [[ "$current_ads" == "none" ]]; then
                kubectl patch job -n "$ns" "$name" --type merge -p "{\"spec\":{\"activeDeadlineSeconds\":$DESIRED_ADS}}" \
                  && echo "  ✓ $job patched to ADS=$DESIRED_ADS" \
                  || echo "  ⚠️  WARNING: Could not patch $job (field may be immutable on this cluster/K8s version)"
              else
                echo "  $job already has ADS=$current_ads, skipping patch"
              fi
            fi
          done
          
          # Also patch initializer and starter Jobs if they exist
          echo "Looking for initializer Jobs to patch..."
          for job in $(kubectl get jobs -A -l "k6_cr,job-name" -o json 2>/dev/null | jq -r '.items[] | select(.metadata.labels["job-name"] | contains("initializer")) | "\(.metadata.namespace)/\(.metadata.name)"'); do
            if [[ -n "$job" ]] && [[ "$job" != "null" ]]; then
              ns=$(echo "$job" | cut -d/ -f1)
              name=$(echo "$job" | cut -d/ -f2)
              current_ads=$(kubectl get job -n "$ns" "$name" -o jsonpath='{.spec.activeDeadlineSeconds}' 2>/dev/null || echo "none")
              echo "  $job current ADS=$current_ads"
              if [[ "$current_ads" == "3600" ]] || [[ "$current_ads" == "" ]] || [[ "$current_ads" == "none" ]]; then
                kubectl patch job -n "$ns" "$name" --type merge -p "{\"spec\":{\"activeDeadlineSeconds\":$DESIRED_ADS}}" \
                  && echo "  ✓ $job patched to ADS=$DESIRED_ADS" \
                  || echo "  ⚠️  WARNING: Could not patch $job"
              fi
            fi
          done
          
          echo "=== Job patching complete ==="
          
          # Verify the patches were applied
          echo ""
          echo "=== Verifying k6 Job activeDeadlineSeconds AFTER patching ==="
          echo "Runner Jobs:"
          kubectl get jobs -A -l "k6_cr,runner=true" -o json 2>/dev/null \
            | jq -r '.items[] | "  \(.metadata.namespace)/\(.metadata.name): ADS=\(.spec.activeDeadlineSeconds // "not set")"' \
            || echo "  No runner jobs found"
          
          # Check if any runner jobs still have wrong limits
          RUNNER_ADS_AFTER=$(kubectl get jobs -A -l "k6_cr,runner=true" -o json 2>/dev/null \
            | jq -r '.items[] | .spec.activeDeadlineSeconds // 0' | sort -u)
          
          # Check for common problematic values
          PROBLEM_FOUND=false
          if echo "$RUNNER_ADS_AFTER" | grep -q "^3600$"; then
            echo "⚠️  ERROR: Some Jobs still have 3600s (1 hour) limit! Patching may have failed."
            PROBLEM_FOUND=true
          fi
          if echo "$RUNNER_ADS_AFTER" | grep -q "^5400$"; then
            echo "⚠️  ERROR: Some Jobs have 5400s (90 minute) limit! This is another k6-operator default."
            PROBLEM_FOUND=true
          fi
          
          # Check if the value is less than what we expect
          for ads in $RUNNER_ADS_AFTER; do
            if [[ $ads -lt $DESIRED_ADS ]] && [[ $ads -ne 0 ]]; then
              echo "⚠️  ERROR: Found Job with ADS=$ads which is less than desired $DESIRED_ADS"
              echo "⚠️  Test will likely stop at $(( $ads / 60 )) minutes instead of ${{ inputs.test_duration_minutes }} minutes"
              PROBLEM_FOUND=true
            fi
          done
          
          if [[ "$PROBLEM_FOUND" == "false" ]]; then
            echo "✅ SUCCESS: All Jobs have been patched to support long-duration testing!"
            echo "✅ All Jobs have activeDeadlineSeconds >= $DESIRED_ADS seconds"
          else
            echo ""
            echo "⚠️⚠️⚠️ WARNING: Job patching may have failed! ⚠️⚠️⚠️"
            echo "The test may terminate early. Check the Job ADS values above."
          fi
          echo ""
          
          # Stop the k6 monitoring process
          if [[ -n "$K6_MONITOR_PID" ]]; then
            echo "Stopping k6 monitoring process (PID: $K6_MONITOR_PID)"
            kill $K6_MONITOR_PID 2>/dev/null || true
          fi

      - name: Backup Tests Terraform State
        if: ${{ !inputs.use_terraform_cloud }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.provider }}-tests-terraform-state-${{ github.run_id }}
          path: |
            tests/terraform.tfstate
            tests/.terraform.lock.hcl
          retention-days: 1

      - name: Show Tyk Gateway logs after tests
        run: |
          echo "=== Tyk Gateway Pod Logs After Tests (last 200 lines) ==="
          kubectl logs -n tyk $(kubectl get pods -n tyk --selector=app=gateway-tyk-tyk-gateway -o jsonpath='{.items[0].metadata.name}') --tail=200 || echo "Failed to get Tyk logs"

      - name: Show k6 Test Status and Logs
        continue-on-error: true
        run: |
          echo "=== k6 Test Resources Status ==="
          kubectl get k6 -A || echo "No k6 resources found"
          
          echo ""
          echo "=== k6 Test Pods Status ==="
          kubectl get pods -A -l "k6_cr" || echo "No k6 pods found"
          
          echo ""
          echo "=== k6 Runner Pod Logs (last 100 lines) ==="
          K6_RUNNER=$(kubectl get pods -A -l "k6_cr,runner=true" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          K6_NAMESPACE=$(kubectl get pods -A -l "k6_cr,runner=true" -o jsonpath='{.items[0].metadata.namespace}' 2>/dev/null || echo "")
          if [[ -n "$K6_RUNNER" && -n "$K6_NAMESPACE" ]]; then
            kubectl logs -n "$K6_NAMESPACE" "$K6_RUNNER" --tail=100 || echo "Failed to get k6 runner logs"
          else
            echo "No k6 runner pods found"
          fi
          
          echo ""
          echo "=== k6 Initializer Pod Logs (last 50 lines) ==="
          K6_INIT=$(kubectl get pods -A -l "k6_cr,initializer=k6" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          K6_INIT_NS=$(kubectl get pods -A -l "k6_cr,initializer=k6" -o jsonpath='{.items[0].metadata.namespace}' 2>/dev/null || echo "")
          if [[ -n "$K6_INIT" && -n "$K6_INIT_NS" ]]; then
            kubectl logs -n "$K6_INIT_NS" "$K6_INIT" --tail=50 || echo "Failed to get k6 initializer logs"
          else
            echo "No k6 initializer pods found"
          fi

      - name: Test Grafana Snapshot
        continue-on-error: true
        run: |
          kubectl logs -n dependencies $(kubectl get pods -n dependencies --selector=app=snapshot-job -o jsonpath='{.items[-1].metadata.name}') --tail=1

      - name: Download Profiles
        if: ${{ inputs.tyk_profiler_enabled == true }}
        continue-on-error: true
        run: |
          kubectl port-forward svc/gateway-svc-tyk-tyk-gateway -n tyk 8080 &
          sleep 5

          mkdir profiles
          wget "http://localhost:8080/debug/pprof/heap?debug=1"       -O ./profiles/${{ inputs.tyk_version }}-heap.txt
          wget "http://localhost:8080/debug/pprof/allocs?debug=1"     -O ./profiles/${{ inputs.tyk_version }}-allocs.txt
          wget "http://localhost:8080/debug/pprof/goroutine?debug=1"  -O ./profiles/${{ inputs.tyk_version }}-goroutine.txt

      - name: Upload Profiles
        if: ${{ inputs.tyk_profiler_enabled == true }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tyk_version }}-profiles
          path: ./profiles
          if-no-files-found: warn

      - name: Recover Tests Terraform State
        if: always() && !inputs.use_terraform_cloud
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.provider }}-tests-terraform-state-${{ github.run_id }}
          path: tests/

      - name: Destroy Tests
        if: always()
        run: |
          cd tests
          # Initialize terraform (required for both local and cloud backends)
          if [[ "${{ inputs.use_terraform_cloud }}" == "false" ]]; then
            echo "🔄 Using local state for tests destruction..."
            # Ensure we have the state file
            if [[ ! -f terraform.tfstate ]]; then
              echo "⚠️  No terraform state found for tests - they may have already been destroyed"
            fi
          else
            echo "🔄 Using Terraform Cloud state for tests destruction..."
            terraform init
          fi
          
          terraform destroy \
            --var="kubernetes_config_context=performance-testing" \
            --auto-approve

      - name: Recover Deployments Terraform State
        if: always() && !inputs.use_terraform_cloud
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.provider }}-deployments-terraform-state-${{ github.run_id }}
          path: deployments/

      - name: Destroy testing resources
        if: always()
        run: |
          cd deployments
          # Initialize terraform (required for both local and cloud backends)
          if [[ "${{ inputs.use_terraform_cloud }}" == "false" ]]; then
            echo "🔄 Using local state for deployments destruction..."
            # Ensure we have the state file
            if [[ ! -f terraform.tfstate ]]; then
              echo "⚠️  No terraform state found for deployments - they may have already been destroyed"
            fi
          else
            echo "🔄 Using Terraform Cloud state for deployments destruction..."
            terraform init
          fi
          
          terraform destroy \
            --var="kubernetes_config_context=performance-testing" \
            --var="tyk_license=${{ secrets.DASH_LICENSE }}" \
            --auto-approve

      - name: Recover AKS Terraform State
        if: always() && inputs.cloud == 'Azure' && !inputs.use_terraform_cloud
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aks-cluster-terraform-state-${{ github.run_id }}
          path: aks/

      - name: Destroy AKS cluster
        if: always() && inputs.cloud == 'Azure'
        run: |
          cd aks
          # Initialize terraform (required for both local and cloud backends)
          if [[ "${{ inputs.use_terraform_cloud }}" == "false" ]]; then
            echo "🔄 Using local state for AKS cluster destruction..."
            # Ensure we have the state file
            if [[ ! -f terraform.tfstate ]]; then
              echo "⚠️  No terraform state found for AKS cluster - it may have already been destroyed"
            fi
          else
            echo "🔄 Using Terraform Cloud state for AKS cluster destruction..."
            terraform init
          fi
          
          terraform destroy \
            --var="cluster_location=${{ vars.AZURE_CLUSTER_LOCATION }}" \
            --var="cluster_machine_type=${{ vars.AZURE_CLUSTER_MACHINE_TYPE }}" \
            --var="upstream_machine_type=${{ vars.AZURE_UPSTREAM_MACHINE_TYPE }}" \
            --var="tests_machine_type=${{ vars.AZURE_TEST_MACHINE_TYPE }}" \
            --auto-approve

      - name: Recover EKS Terraform State
        if: always() && inputs.cloud == 'AWS' && !inputs.use_terraform_cloud
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: eks-cluster-terraform-state-${{ github.run_id }}
          path: eks/

      - name: Destroy EKS cluster
        if: always() && inputs.cloud == 'AWS'
        run: |
          cd eks
          # Initialize terraform (required for both local and cloud backends)
          if [[ "${{ inputs.use_terraform_cloud }}" == "false" ]]; then
            echo "🔄 Using local state for EKS cluster destruction..."
            # Ensure we have the state file
            if [[ ! -f terraform.tfstate ]]; then
              echo "⚠️  No terraform state found for EKS cluster - it may have already been destroyed"
            fi
          else
            echo "🔄 Using Terraform Cloud state for EKS cluster destruction..."
            terraform init
          fi
          
          terraform destroy \
            --var="cluster_location=${{ vars.AWS_CLUSTER_LOCATION }}" \
            --var="cluster_machine_type=${{ vars.AWS_CLUSTER_MACHINE_TYPE }}" \
            --var="upstream_machine_type=${{ vars.AWS_UPSTREAM_MACHINE_TYPE }}" \
            --var="tests_machine_type=${{ vars.AWS_TEST_MACHINE_TYPE }}" \
            --auto-approve

      - name: Recover GKE Terraform State
        if: always() && inputs.cloud == 'GCP' && !inputs.use_terraform_cloud
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gke-cluster-terraform-state-${{ github.run_id }}
          path: gke/

      - name: Destroy GKE cluster
        if: always() && inputs.cloud == 'GCP'
        run: |
          cd gke
          # Initialize terraform (required for both local and cloud backends)
          if [[ "${{ inputs.use_terraform_cloud }}" == "false" ]]; then
            echo "🔄 Using local state for GKE cluster destruction..."
            # Ensure we have the state file
            if [[ ! -f terraform.tfstate ]]; then
              echo "⚠️  No terraform state found for GKE cluster - it may have already been destroyed"
            fi
          else
            echo "🔄 Using Terraform Cloud state for GKE cluster destruction..."
            terraform init
          fi
          
          terraform destroy \
            --var="project=${{ secrets.GCP_PROJECT }}" \
            --var="cluster_location=${{ vars.GCP_CLUSTER_LOCATION }}" \
            --var="cluster_machine_type=${{ vars.GCP_CLUSTER_MACHINE_TYPE }}" \
            --var="upstream_machine_type=${{ vars.GCP_UPSTREAM_MACHINE_TYPE }}" \
            --var="tests_machine_type=${{ vars.GCP_TEST_MACHINE_TYPE }}" \
            --auto-approve
